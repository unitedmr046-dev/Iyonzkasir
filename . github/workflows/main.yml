name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Compile dulu — kalau ada error, stop di sini (hemat waktu)
      - name: Compile Check
        run: gradle compileDebugKotlin

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iyonzkasir-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.0-build-${{ github.run_number }}
          name: iyonzkasir v0.8.0 (Build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
