name: Build APK
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: keytool -genkey -v -keystore app/release.keystore -alias iyonzkasir -keyalg RSA -keysize 2048 -validity 10000 -storepass iyonzkasir2026 -keypass iyonzkasir2026 -dname "CN=Aiyonz,O=Aiyonz,C=ID"
      - run: gradle assembleRelease
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: aiyonz-kasir build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
