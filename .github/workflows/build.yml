name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: keytool -genkey -v -keystore app/release.keystore -alias iyonzkasir -keyalg RSA -keysize 2048 -validity 10000 -storepass iyonzkasir2026 -keypass iyonzkasir2026 -dname "CN=Aiyonz Kasir, OU=POS, O=Aiyonz, L=Indonesia, S=NTB, C=ID"
      - run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aiyonz-kasir-release-apk
          path: app/build/outputs/apk/release/*.apk
